name: Build workflow
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build ipa
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - name: Build
        run: |
          fastlane build_unsign_ipa

      # - name: List, filter and delete artifacts
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   uses: actions/github-script@v6
      #   id: artifact
      #   with:
      #     script: |
      #       const { owner, repo } = context.issue
            
      #       const res = await github.rest.actions.listArtifactsForRepo({
      #         owner,
      #         repo,
      #       })
            
      #       res.data.artifacts
      #         .forEach(({ id }) => { github.rest.actions.deleteArtifact({ owner, repo, artifact_id: id, }) })

      - name: Publish rolling nightly (unsigned IPA)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv BilbiliAtvDemo.ipa BilbiliAtvDemo-unsigned.ipa
          gh release delete "nightly" -y --cleanup-tag || true
          gh release create "nightly" BilbiliAtvDemo-unsigned.ipa \
            -t "Nightly (unsigned)" -p \
            --notes "滚动构建的未签名 IPA，每次推送 main 自动更新。使用 Sideloadly / AltStore 侧载安装；或源码 \`fastlane build_unsign_ipa\` 自行构建。稳定版本见 [Releases](../../releases/latest)。"
